<template>
    <div class="ri-card">
        <div class="ri-card__header">
            <div class="ri-card__header-icon">
                <lightning-icon icon-name="standard:approval" size="small" alternative-text="Approvals"></lightning-icon>
            </div>
            <h2 class="ri-card__title">Payment Approvals</h2>
        </div>

        <template if:true={isLoading}>
            <div class="ri-spinner-wrap"><div class="ri-spinner"></div></div>
        </template>

        <template if:true={error}>
            <div class="ri-error-msg">{error}</div>
        </template>
        <template if:true={successMessage}>
            <div class="ri-success-msg">{successMessage}</div>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasPayments}>
                <div class="ri-appr-list">
                    <template for:each={paymentRows} for:item="p">
                        <div key={p.Id} class="ri-appr-card">
                            <div class="ri-appr-card__top">
                                <div>
                                    <div class="ri-appr-card__name">{p.Name}</div>
                                    <div class="ri-appr-card__meta">
                                        {p.tenantName} &middot; {p.propertyName} &middot; {p.tenancyName}
                                    </div>
                                </div>
                                <span class="ri-appr-card__amount">
                                    <lightning-formatted-number value={p.Amount__c} format-style="currency"
                                        currency-code="AUD" minimum-fraction-digits="2"></lightning-formatted-number>
                                </span>
                            </div>

                            <div class="ri-appr-grid">
                                <div class="ri-appr-field">
                                    <span class="ri-appr-field__label">Payment Date</span>
                                    <span class="ri-appr-field__value">
                                        <lightning-formatted-date-time value={p.Payment_Date__c}
                                            year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                                    </span>
                                </div>
                                <div class="ri-appr-field">
                                    <span class="ri-appr-field__label">Method</span>
                                    <span class="ri-appr-field__value">{p.Payment_Method__c}</span>
                                </div>
                                <div class="ri-appr-field">
                                    <span class="ri-appr-field__label">Invoice</span>
                                    <span class="ri-appr-field__value">{p.invoiceName}</span>
                                </div>
                                <div class="ri-appr-field">
                                    <span class="ri-appr-field__label">Reference</span>
                                    <span class="ri-appr-field__value">{p.Payment_Reference__c}</span>
                                </div>
                            </div>

                            <template if:true={p.Comment__c}>
                                <div class="ri-appr-field">
                                    <span class="ri-appr-field__label">Tenant Comment</span>
                                    <span class="ri-appr-field__value">{p.Comment__c}</span>
                                </div>
                            </template>

                            <div class="ri-appr-comment">
                                <lightning-input type="text" label="Approver comment (optional)"
                                    data-id={p.Id} onchange={handleComment}
                                    placeholder="Add a note for the tenant"></lightning-input>
                            </div>

                            <div class="ri-appr-actions">
                                <button class="ri-btn ri-btn--approve" data-id={p.Id}
                                    onclick={handleApprove} disabled={p.isProcessing}>Approve</button>
                                <button class="ri-btn ri-btn--reject" data-id={p.Id}
                                    onclick={handleReject} disabled={p.isProcessing}>Reject</button>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={hasPayments}>
                <div class="ri-empty-state">
                    <lightning-icon icon-name="utility:check" size="large" alternative-text="All clear"></lightning-icon>
                    <p>No payments are waiting for your approval.</p>
                </div>
            </template>
        </template>
    </div>
</template>
