<template>
    <template if:true={tenancy}>
        <!-- Hero Banner -->
        <div class="ri-hero">
            <div class="ri-hero-bg"></div>
            <div class="ri-hero-inner">
                <div class="ri-greeting">
                    <div class="ri-avatar">{avatarInitial}</div>
                    <div class="ri-greeting-text">
                        <h1 class="ri-hero-title">Welcome back, {firstName}</h1>
                        <p class="ri-hero-sub">
                            Tenancy&nbsp;
                            <span class="ri-badge ri-badge--{statusClass}">{tenancy.Status__c}</span>
                        </p>
                    </div>
                </div>
                <div class="ri-stats">
                    <div class="ri-stat-card ri-stat-card--property">
                        <div class="ri-stat-card__icon">
                            <lightning-icon icon-name="standard:home" size="small" alternative-text="Property"></lightning-icon>
                        </div>
                        <div class="ri-stat-card__body">
                            <div class="ri-stat-card__label">Property</div>
                            <div class="ri-stat-card__value">{tenancy.Property__r.Name}</div>
                            <template if:true={tenancy.Room__r}>
                                <div class="ri-stat-card__sub">Room: {tenancy.Room__r.Name}</div>
                            </template>
                        </div>
                    </div>
                    <div class="ri-stat-card ri-stat-card--credits">
                        <div class="ri-stat-card__icon">
                            <lightning-icon icon-name="utility:currency" size="small" alternative-text="Credits"></lightning-icon>
                        </div>
                        <div class="ri-stat-card__body">
                            <div class="ri-stat-card__label">Available Credits</div>
                            <div class="ri-stat-card__value">
                                <lightning-formatted-number
                                    value={tenancy.Available_Credits__c}
                                    format-style="currency"
                                    currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                    <div class="ri-stat-card ri-stat-card--arrears">
                        <div class="ri-stat-card__icon">
                            <lightning-icon icon-name="utility:error" size="small" alternative-text="Arrears"></lightning-icon>
                        </div>
                        <div class="ri-stat-card__body">
                            <div class="ri-stat-card__label">Total Arrears</div>
                            <div class="ri-stat-card__value">
                                <lightning-formatted-number
                                    value={tenancy.Total_Arrears__c}
                                    format-style="currency"
                                    currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                    <div class="ri-stat-card ri-stat-card--received">
                        <div class="ri-stat-card__icon">
                            <lightning-icon icon-name="utility:check" size="small" alternative-text="Received"></lightning-icon>
                        </div>
                        <div class="ri-stat-card__body">
                            <div class="ri-stat-card__label">Total Received</div>
                            <div class="ri-stat-card__value">
                                <lightning-formatted-number
                                    value={tenancy.Total_Received__c}
                                    format-style="currency"
                                    currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upcoming invoice alert -->
        <template if:true={upcomingInvoice}>
            <div class="ri-alert ri-alert--warning">
                <div class="ri-alert__icon">
                    <lightning-icon icon-name="utility:clock" size="small" alternative-text="Due soon"></lightning-icon>
                </div>
                <div class="ri-alert__body">
                    <strong>Payment due soon</strong> &mdash;
                    <lightning-formatted-number
                        value={upcomingInvoice.Balance_Due__c}
                        format-style="currency"
                        currency-code="AUD"
                        minimum-fraction-digits="2">
                    </lightning-formatted-number>
                    &nbsp;due by&nbsp;
                    <lightning-formatted-date-time
                        value={upcomingInvoice.Due_Date__c}
                        year="numeric"
                        month="short"
                        day="2-digit">
                    </lightning-formatted-date-time>
                </div>
                <button class="ri-alert__action" onclick={navigateToInvoices}>View Invoices</button>
            </div>
        </template>
    </template>

    <template if:true={isLoading}>
        <div class="ri-loading">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
        </div>
    </template>

    <template if:true={error}>
        <div class="ri-error"><p>{error}</p></div>
    </template>
</template>
