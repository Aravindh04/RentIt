<template>
    <div class="ri-card">
        <div class="ri-card__header">
            <div class="ri-card__header-icon">
                <lightning-icon icon-name="standard:payment_gateway" size="small" alternative-text="Payments"></lightning-icon>
            </div>
            <h2 class="ri-card__title">Payment History</h2>
        </div>

        <!-- Filter tabs (list view only) -->
        <template if:true={showList}>
            <div class="ri-filter-tabs">
                <button class={tabAll}      onclick={handleTabAll}>All</button>
                <button class={tabPending}  onclick={handleTabPending}>Pending Approval</button>
                <button class={tabReceived} onclick={handleTabReceived}>Received</button>
                <button class={tabRejected} onclick={handleTabRejected}>Rejected</button>
            </div>
        </template>

        <!-- Spinner -->
        <template if:true={isLoading}>
            <div class="ri-spinner-wrap">
                <div class="ri-spinner"></div>
            </div>
        </template>

        <template if:true={error}>
            <div class="ri-error-msg">{error}</div>
        </template>

        <!-- List View -->
        <template if:true={showList}>
            <template if:true={hasPayments}>
                <div class="ri-table-wrap">
                    <table class="ri-table">
                        <thead>
                            <tr>
                                <th>Payment Name</th>
                                <th>Amount</th>
                                <th>Date</th>
                                <th>Method</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredPayments} for:item="pmt">
                                <tr key={pmt.Id}
                                    class="ri-tr--clickable"
                                    onclick={handlePaymentSelect}
                                    data-id={pmt.Id}>
                                    <td class="ri-td--ref">
                                        <span class="ri-pmt-name-link">{pmt.Name}</span>
                                    </td>
                                    <td class="ri-td--amount">
                                        <lightning-formatted-number
                                            value={pmt.Amount__c}
                                            format-style="currency"
                                            currency-code="AUD"
                                            minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td>
                                        <lightning-formatted-date-time
                                            value={pmt.Payment_Date__c}
                                            year="numeric" month="short" day="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>
                                    <td>{pmt.Payment_Method__c}</td>
                                    <td>
                                        <span class="ri-status" data-status={pmt.Status__c}>{pmt.Status__c}</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasPayments}>
                <template if:false={isLoading}>
                    <div class="ri-empty-state">
                        <lightning-icon icon-name="utility:list" size="large" alternative-text="No payments"></lightning-icon>
                        <p>No payments found for the selected filter.</p>
                    </div>
                </template>
            </template>
        </template>

        <!-- Detail View -->
        <template if:true={showDetail}>
            <div class="ri-detail-panel">
                <button class="ri-back-btn" onclick={handleCloseDetail}>
                    <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text="Back"></lightning-icon>
                    Back to Payments
                </button>
                <div class="ri-detail-header">
                    <div>
                        <div class="ri-detail-title">{selectedPayment.Name}</div>
                        <div class="ri-detail-date">
                            <lightning-formatted-date-time
                                value={selectedPayment.Payment_Date__c}
                                year="numeric" month="long" day="2-digit">
                            </lightning-formatted-date-time>
                        </div>
                    </div>
                    <span class="ri-status" data-status={selectedPayment.Status__c}>{selectedPayment.Status__c}</span>
                </div>

                <div class="ri-amount-tile">
                    <span class="ri-amount-tile__label">Amount Paid</span>
                    <span class="ri-amount-tile__value">
                        <lightning-formatted-number
                            value={selectedPayment.Amount__c}
                            format-style="currency"
                            currency-code="AUD"
                            minimum-fraction-digits="2">
                        </lightning-formatted-number>
                    </span>
                </div>

                <div class="ri-detail-meta">
                    <div class="ri-detail-row">
                        <span class="ri-detail-label">Payment Method</span>
                        <span class="ri-detail-value">{selectedPayment.Payment_Method__c}</span>
                    </div>
                    <template if:true={selectedPayment.Payment_Reference__c}>
                        <div class="ri-detail-row">
                            <span class="ri-detail-label">Reference</span>
                            <span class="ri-detail-value">{selectedPayment.Payment_Reference__c}</span>
                        </div>
                    </template>
                    <template if:true={selectedPayment.Comment__c}>
                        <div class="ri-detail-row">
                            <span class="ri-detail-label">Comment</span>
                            <span class="ri-detail-value ri-detail-value--comment">{selectedPayment.Comment__c}</span>
                        </div>
                    </template>
                </div>

                <!-- Attachments — collapsible -->
                <div class="ri-pmt-collapsible">
                    <button class="ri-pmt-attach-toggle" onclick={toggleAttachments} aria-expanded={isAttachmentsOpen}>
                        <div class="ri-pmt-attach-label">
                            <lightning-icon icon-name="utility:attach" size="x-small" alternative-text="Attachments"></lightning-icon>
                            <span>{attachmentLabel}</span>
                        </div>
                        <lightning-icon icon-name={attachmentToggleIcon} size="x-small" alternative-text="Toggle"></lightning-icon>
                    </button>
                    <template if:true={isAttachmentsOpen}>
                        <template if:true={hasFiles}>
                            <ul class="ri-pmt-file-list">
                                <template for:each={paymentFiles} for:item="file">
                                    <li key={file.id} class="ri-pmt-file-item">
                                        <lightning-icon icon-name="doctype:attachment" size="small" alternative-text="File"></lightning-icon>
                                        <div class="ri-pmt-file-info">
                                            <a href={file.downloadUrl} target="_blank" class="ri-pmt-file-name">{file.title}</a>
                                            <span class="ri-pmt-file-meta">{file.fileType} &middot; {file.size}</span>
                                        </div>
                                        <a href={file.downloadUrl} target="_blank" class="ri-pmt-file-download" title="Download">
                                            <lightning-icon icon-name="utility:download" size="x-small" alternative-text="Download"></lightning-icon>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <template if:false={hasFiles}>
                            <p class="ri-pmt-no-files">No attachments on this payment.</p>
                        </template>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
