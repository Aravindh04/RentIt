<template>
    <div class="slds-box slds-theme_default">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Payment History</h2>

        <!-- Status filter tabs -->
        <lightning-tabset active-tab-value={activeTab} onactive={handleTabChange}>
            <lightning-tab label="All"      value="all"></lightning-tab>
            <lightning-tab label="Pending"  value="Pending"></lightning-tab>
            <lightning-tab label="Approved" value="Approved"></lightning-tab>
            <lightning-tab label="Rejected" value="Rejected"></lightning-tab>
        </lightning-tabset>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading payments" size="medium"></lightning-spinner>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error slds-m-top_small">{error}</p>
        </template>

        <template if:true={hasPayments}>
            <lightning-datatable
                key-field="Id"
                data={filteredPayments}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template if:false={hasPayments}>
            <template if:false={isLoading}>
                <p class="slds-text-color_weak slds-m-top_small">No payments found for the selected status.</p>
            </template>
        </template>
    </div>
</template>
