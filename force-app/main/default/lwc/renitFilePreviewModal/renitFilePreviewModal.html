<template>
    <!-- SLDS Modal backdrop and container -->
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container">
                
                <!-- Header -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleClose}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">{fileName}</h2>
                </header>

                <!-- Body holding the Salesforce preview servlet iframe -->
                <div class="slds-modal__content slds-p-around_medium" style="height: 75vh;">
                    <template if:true={filePreviewUrl}>
                        <iframe src={filePreviewUrl} width="100%" height="100%" style="border: none;"></iframe>
                    </template>
                </div>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
