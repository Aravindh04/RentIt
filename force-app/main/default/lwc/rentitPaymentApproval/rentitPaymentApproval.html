<template>
    <div class="slds-box slds-theme_default">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">Pending Payment Approvals</h2>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading payments" size="medium"></lightning-spinner>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error">{error}</p>
        </template>

        <template if:true={hasPayments}>
            <lightning-datatable
                key-field="Id"
                data={payments}
                columns={columns}
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </template>

        <template if:false={hasPayments}>
            <template if:false={isLoading}>
                <p class="slds-text-color_weak">No payments pending approval.</p>
            </template>
        </template>

        <!-- Confirmation toast area -->
        <template if:true={actionMessage}>
            <div class={actionMessageClass} role="status">
                {actionMessage}
            </div>
        </template>
    </div>
</template>
