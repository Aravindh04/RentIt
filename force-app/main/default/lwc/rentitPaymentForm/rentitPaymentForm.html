<template>
    <div class="ri-card">
        <div class="ri-card__header">
            <div class="ri-card__header-icon">
                <lightning-icon icon-name="utility:money" size="small" alternative-text="Payment"></lightning-icon>
            </div>
            <h2 class="ri-card__title">Make a Payment</h2>
        </div>

        <template if:true={isLoading}>
            <div class="ri-spinner-wrap">
                <div class="ri-spinner"></div>
            </div>
        </template>

        <template if:false={isLoading}>
            <!-- Success State -->
            <template if:true={submitSuccess}>
                <div class="ri-success">
                    <div class="ri-success__icon">
                        <lightning-icon icon-name="utility:success" size="large" alternative-text="Success"></lightning-icon>
                    </div>
                    <h3 class="ri-success__title">Payment Submitted</h3>
                    <p class="ri-success__sub">{successSubMessage}</p>
                    <span class="ri-success__ref">Reference: {submittedId}</span>
                    <template if:true={screenshotAttached}>
                        <span class="ri-success__info">
                            <lightning-icon icon-name="utility:attach" size="xx-small"></lightning-icon>
                            &nbsp;Screenshot attached
                        </span>
                    </template>
                </div>
            </template>

            <!-- Form -->
            <template if:false={submitSuccess}>
                <div class="ri-card__body">
                    <!-- Payment type toggle -->
                    <div class="ri-type-selector">
                        <button class={btnInvoice} onclick={handleTypeInvoice}>
                            <lightning-icon icon-name="utility:description" size="xx-small"></lightning-icon>
                            &nbsp;Invoice Payment
                        </button>
                        <button class={btnGeneral} onclick={handleTypeGeneral}>
                            <lightning-icon icon-name="utility:money" size="xx-small"></lightning-icon>
                            &nbsp;General Rent Payment
                        </button>
                    </div>

                    <!-- Invoice selection (invoice payments only) -->
                    <template if:true={isInvoicePayment}>
                        <p class="ri-section-label">Invoice Details</p>
                        <lightning-combobox
                            label="Select Invoice"
                            value={selectedInvoiceId}
                            options={invoiceOptions}
                            onchange={handleInvoiceChange}
                            required>
                        </lightning-combobox>
                        <hr class="ri-divider"/>
                    </template>

                    <!-- General payment info banner -->
                    <template if:true={isGeneralPayment}>
                        <div class="ri-info-banner">
                            <lightning-icon icon-name="utility:info" size="xx-small"></lightning-icon>
                            &nbsp;This payment is not linked to a specific invoice. It will be credited to your account and applied against outstanding arrears.
                        </div>
                        <hr class="ri-divider"/>
                    </template>

                    <p class="ri-section-label">Payment Details</p>

                    <div class="ri-field-row">
                        <lightning-input
                            type="number"
                            label="Amount (AUD)"
                            value={amount}
                            onchange={handleAmountChange}
                            min="0.01"
                            step="0.01"
                            required>
                        </lightning-input>
                        <lightning-input
                            type="date"
                            label="Payment Date"
                            value={paymentDate}
                            onchange={handlePaymentDateChange}
                            required>
                        </lightning-input>
                        <lightning-combobox
                            label="Payment Method"
                            value={paymentMethod}
                            options={paymentMethodOptions}
                            onchange={handleMethodChange}
                            required>
                        </lightning-combobox>
                        <lightning-input
                            type="text"
                            label="Payment Reference"
                            value={paymentReference}
                            onchange={handleReferenceChange}
                            maxlength="255"
                            placeholder="Bank transaction ID or receipt">
                        </lightning-input>
                        <div class="ri-full-width">
                            <lightning-input
                                type="textarea"
                                label="Comment (optional)"
                                value={comment}
                                onchange={handleCommentChange}
                                max-length="1000"
                                placeholder="Any additional notes for the landlord">
                            </lightning-input>
                        </div>
                    </div>

                    <hr class="ri-divider"/>
                    <p class="ri-section-label">Payment Screenshot</p>

                    <!-- File upload -->
                    <div class="ri-attach-section">
                        <label class="ri-upload-label">
                            <input type="file"
                                   accept="image/jpeg,image/png,image/gif,image/webp,application/pdf"
                                   class="ri-file-input"
                                   onchange={handleFileChange}>
                            <lightning-icon icon-name="utility:upload" size="x-small" alternative-text="Upload"></lightning-icon>
                            Attach screenshot
                            <span class="ri-upload-hint">JPG, PNG, PDF · max 3 MB · optional</span>
                        </label>

                        <template if:true={selectedFile}>
                            <div class="ri-file-chip">
                                <lightning-icon icon-name="utility:attach" size="xx-small" alternative-text="File"></lightning-icon>
                                <span class="ri-file-chip__name">{selectedFileName}</span>
                                <span class="ri-file-chip__size">&nbsp;({selectedFileSizeFormatted})</span>
                                <button type="button" class="ri-file-chip__remove" onclick={handleFileRemove} title="Remove file">×</button>
                            </div>
                        </template>

                        <template if:true={imagePreviewUrl}>
                            <div class="ri-preview-wrap">
                                <img src={imagePreviewUrl} alt="Screenshot preview" class="ri-preview-img">
                            </div>
                        </template>

                        <template if:true={fileError}>
                            <div class="ri-upload-error">{fileError}</div>
                        </template>
                    </div>

                    <template if:true={formError}>
                        <div class="ri-error-msg">{formError}</div>
                    </template>

                    <div class="ri-actions">
                        <lightning-button
                            label="Submit Payment"
                            variant="brand"
                            onclick={handleSubmit}
                            disabled={isSubmitting}>
                        </lightning-button>
                    </div>
                </div>
            </template>
        </template>
    </div>
</template>
