<template>
    <!-- Tenant persona block — shown only when tenancy data resolves -->
    <template if:true={tenancy}>
        <div class="slds-box slds-theme_default slds-m-bottom_medium">
            <h1 class="slds-text-heading_large slds-m-bottom_small">
                Welcome back, {userName}
            </h1>
            <p class="slds-text-body_regular">
                Property: <strong>{tenancy.Property__r.Name}</strong>
                &nbsp;|&nbsp;
                Room: <strong>{tenancy.Room__r.Name}</strong>
                &nbsp;|&nbsp;
                Status: <strong>{tenancy.Status__c}</strong>
            </p>
            <p class="slds-m-top_small">
                Available Credits:&nbsp;
                <lightning-formatted-number
                    value={tenancy.Available_Credits__c}
                    format-style="currency"
                    currency-code="AUD">
                </lightning-formatted-number>
                &nbsp;|&nbsp;
                Arrears:&nbsp;
                <lightning-formatted-number
                    value={tenancy.Total_Arrears__c}
                    format-style="currency"
                    currency-code="AUD">
                </lightning-formatted-number>
            </p>
        </div>

        <!-- Upcoming invoice alert -->
        <template if:true={upcomingInvoice}>
            <div class="slds-box slds-theme_warning slds-m-bottom_medium">
                <lightning-icon
                    icon-name="utility:warning"
                    alternative-text="Warning"
                    size="small"
                    class="slds-m-right_x-small">
                </lightning-icon>
                <strong>Invoice due soon:</strong>
                &nbsp;
                <lightning-formatted-number
                    value={upcomingInvoice.Balance_Due__c}
                    format-style="currency"
                    currency-code="AUD">
                </lightning-formatted-number>
                due by
                <lightning-formatted-date-time
                    value={upcomingInvoice.Due_Date__c}
                    year="numeric"
                    month="short"
                    day="2-digit">
                </lightning-formatted-date-time>
                &nbsp;
                <a onclick={navigateToInvoices}>View Invoices</a>
            </div>
        </template>
    </template>

    <template if:true={error}>
        <p class="slds-text-color_error">{error}</p>
    </template>

    <template if:true={isLoading}>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </template>
</template>
