<template>
    <div class="slds-box slds-theme_default">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">My Invoices</h2>

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading invoices" size="medium"></lightning-spinner>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error">{error}</p>
        </template>

        <template if:true={hasInvoices}>
            <lightning-datatable
                key-field="Id"
                data={invoices}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </template>

        <template if:false={hasInvoices}>
            <template if:false={isLoading}>
                <p class="slds-text-color_weak">No invoices found.</p>
            </template>
        </template>
    </div>
</template>
