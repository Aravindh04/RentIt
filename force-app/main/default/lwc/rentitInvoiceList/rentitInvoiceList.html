<template>
    <div class="ri-card">
        <div class="ri-card__header">
            <div class="ri-card__header-icon">
                <lightning-icon icon-name="standard:invoice" size="small" alternative-text="Invoices"></lightning-icon>
            </div>
            <h2 class="ri-card__title">My Invoices</h2>
        </div>

        <template if:true={error}>
            <div class="ri-error-msg">{error}</div>
        </template>

        <!-- List View -->
        <template if:true={showList}>
            <!-- Status filter tabs -->
            <div class="ri-filter-tabs">
                <button class={tabAll}       onclick={handleTabAll}>All</button>
                <button class={tabScheduled} onclick={handleTabScheduled}>Scheduled</button>
                <button class={tabUnpaid}    onclick={handleTabUnpaid}>Unpaid</button>
                <button class={tabOverdue}   onclick={handleTabOverdue}>Overdue</button>
                <button class={tabPaid}      onclick={handleTabPaid}>Paid</button>
            </div>

            <!-- Category filter tabs -->
            <div class="ri-cat-tabs">
                <span class="ri-cat-tabs__label">Type:</span>
                <button class={catAll}       onclick={handleCatAll}>All</button>
                <button class={catRent}      onclick={handleCatRent}>Rent</button>
                <button class={catUtilities} onclick={handleCatUtilities}>Utilities</button>
            </div>

            <!-- Spinner below TYPE selection (Feedback 27) -->
            <template if:true={isLoading}>
                <div class="ri-spinner-wrap">
                    <div class="ri-spinner"></div>
                </div>
            </template>

            <template if:true={hasInvoices}>
                <div class="ri-table-wrap">
                    <table class="ri-table">
                        <thead>
                            <tr>
                                <th>Invoice</th>
                                <th>Type</th>
                                <th>Period</th>
                                <th>Total</th>
                                <th>Paid</th>
                                <th>Balance Due</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={filteredInvoices} for:item="inv">
                                <tr key={inv.Id}
                                    class="ri-tr--clickable"
                                    onclick={handleInvoiceSelect}
                                    data-id={inv.Id}>
                                    <td class="ri-td--name">
                                        <span class="ri-inv-name-link">{inv.Name}</span>
                                        <template if:true={inv.Discount__c}>
                                            <span class="ri-discount-badge">Discount Applied</span>
                                        </template>
                                    </td>
                                    <td>
                                        <span class="ri-cat" data-cat={inv.Category__c}>{inv.Category__c}</span>
                                    </td>
                                    <td class="ri-td--period">
                                        <lightning-formatted-date-time
                                            value={inv.Period_Start__c}
                                            year="numeric" month="short" day="2-digit">
                                        </lightning-formatted-date-time>
                                        &nbsp;&ndash;&nbsp;
                                        <lightning-formatted-date-time
                                            value={inv.Period_End__c}
                                            year="numeric" month="short" day="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>
                                    <td>
                                        <lightning-formatted-number
                                            value={inv.Total_Amount__c}
                                            format-style="currency" currency-code="AUD"
                                            minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td>
                                        <lightning-formatted-number
                                            value={inv.Total_Paid__c}
                                            format-style="currency" currency-code="AUD"
                                            minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td class="ri-td--balance">
                                        <lightning-formatted-number
                                            value={inv.Balance_Due__c}
                                            format-style="currency" currency-code="AUD"
                                            minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </td>
                                    <td>
                                        <lightning-formatted-date-time
                                            value={inv.Due_Date__c}
                                            year="numeric" month="short" day="2-digit">
                                        </lightning-formatted-date-time>
                                    </td>
                                    <td>
                                        <span class="ri-status" data-status={inv.Status__c}>{inv.Status__c}</span>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <template if:false={hasInvoices}>
                <template if:false={isLoading}>
                    <div class="ri-empty-state">
                        <lightning-icon icon-name="utility:check" size="large" alternative-text="No invoices"></lightning-icon>
                        <p>No invoices match the selected filters.</p>
                    </div>
                </template>
            </template>
        </template>

        <!-- Detail View -->
        <template if:true={showDetail}>
            <div class="ri-detail-panel">
                <button class="ri-back-btn" onclick={handleCloseDetail}>
                    <lightning-icon icon-name="utility:chevronleft" size="xx-small" alternative-text="Back"></lightning-icon>
                    Back to Invoices
                </button>
                <div class="ri-detail-header">
                    <div>
                        <div class="ri-detail-title">{selectedInvoice.Name}</div>
                        <div class="ri-detail-period">
                            <lightning-formatted-date-time
                                value={selectedInvoice.Period_Start__c}
                                year="numeric" month="short" day="2-digit">
                            </lightning-formatted-date-time>
                            &nbsp;&ndash;&nbsp;
                            <lightning-formatted-date-time
                                value={selectedInvoice.Period_End__c}
                                year="numeric" month="short" day="2-digit">
                            </lightning-formatted-date-time>
                        </div>
                    </div>
                    <div class="ri-detail-header__badges">
                        <span class="ri-cat" data-cat={selectedInvoice.Category__c}>{selectedInvoice.Category__c}</span>
                        <span class="ri-status" data-status={selectedInvoice.Status__c}>{selectedInvoice.Status__c}</span>
                    </div>
                </div>
                <div class="ri-metrics">
                    <!-- Original + Discount — only when discount applies -->
                    <template if:true={selectedHasDiscount}>
                        <div class="ri-metric">
                            <span class="ri-metric__label">Original Amount</span>
                            <span class="ri-metric__value">
                                <lightning-formatted-number
                                    value={selectedOriginalAmount}
                                    format-style="currency" currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </span>
                        </div>
                        <div class="ri-metric ri-metric--discount">
                            <span class="ri-metric__label">Discounted</span>
                            <span class="ri-metric__value">−&nbsp;<lightning-formatted-number
                                    value={selectedDiscountAmount}
                                    format-style="currency" currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </span>
                        </div>
                    </template>
                    <!-- GST — only when > 0 -->
                    <template if:true={selectedHasGst}>
                        <div class="ri-metric">
                            <span class="ri-metric__label">GST Amount</span>
                            <span class="ri-metric__value">
                                <lightning-formatted-number
                                    value={selectedGstAmount}
                                    format-style="currency" currency-code="AUD"
                                    minimum-fraction-digits="2">
                                </lightning-formatted-number>
                            </span>
                        </div>
                    </template>
                    <!-- Always shown -->
                    <div class="ri-metric">
                        <span class="ri-metric__label">Total Amount</span>
                        <span class="ri-metric__value">
                            <lightning-formatted-number
                                value={selectedInvoice.Total_Amount__c}
                                format-style="currency" currency-code="AUD"
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </span>
                    </div>
                    <div class="ri-metric">
                        <span class="ri-metric__label">Total Paid</span>
                        <span class="ri-metric__value">
                            <lightning-formatted-number
                                value={selectedInvoice.Total_Paid__c}
                                format-style="currency" currency-code="AUD"
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </span>
                    </div>
                    <div class="ri-metric ri-metric--balance">
                        <span class="ri-metric__label">Balance Due</span>
                        <span class="ri-metric__value">
                            <lightning-formatted-number
                                value={selectedInvoice.Balance_Due__c}
                                format-style="currency" currency-code="AUD"
                                minimum-fraction-digits="2">
                            </lightning-formatted-number>
                        </span>
                    </div>
                </div>
                <div class="ri-detail-meta">
                    <div class="ri-detail-row">
                        <span class="ri-detail-label">Due Date</span>
                        <span>
                            <lightning-formatted-date-time
                                value={selectedInvoice.Due_Date__c}
                                year="numeric" month="long" day="2-digit">
                            </lightning-formatted-date-time>
                        </span>
                    </div>
                </div>
                <!-- Discount section — collapsible, shown only if discount applied -->
                <template if:true={hasDiscount}>
                    <div class="ri-collapsible-section ri-collapsible-section--spaced">
                        <button class="ri-collapsible-toggle" onclick={toggleDiscount} aria-expanded={isDiscountOpen}>
                            <div class="ri-collapsible-label">
                                <lightning-icon icon-name="utility:discount" size="x-small" alternative-text="Discount"></lightning-icon>
                                <span>Discount Details</span>
                            </div>
                            <lightning-icon icon-name={discountToggleIcon} size="x-small" alternative-text="Toggle"></lightning-icon>
                        </button>
                        <template if:true={isDiscountOpen}>
                            <div class="ri-collapsible-body">
                                <div class="ri-detail-row">
                                    <span class="ri-detail-label">Type</span>
                                    <span class="ri-discount-type-badge" data-type={discountType}>{discountType}</span>
                                </div>
                                <div class="ri-detail-row">
                                    <span class="ri-detail-label">Discount Value</span>
                                    <template if:true={discountIsPercentage}>
                                        <span class="ri-discount-value">{discountValue}%</span>
                                    </template>
                                    <template if:true={discountIsFixed}>
                                        <span class="ri-discount-value">
                                            <lightning-formatted-number
                                                value={discountValue}
                                                format-style="currency"
                                                currency-code="AUD"
                                                minimum-fraction-digits="2">
                                            </lightning-formatted-number>
                                        </span>
                                    </template>
                                </div>
                                <div class="ri-detail-row">
                                    <span class="ri-detail-label">Applied Amount</span>
                                    <span class="ri-discount-value ri-discount-value--applied">
                                        <lightning-formatted-number
                                            value={discountAmount}
                                            format-style="currency"
                                            currency-code="AUD"
                                            minimum-fraction-digits="2">
                                        </lightning-formatted-number>
                                    </span>
                                </div>
                                <!-- Discount period + coverage (Feedback 28) -->
                                <template if:true={discountHasPeriodInfo}>
                                    <div class="ri-detail-row">
                                        <span class="ri-detail-label">Discount Period</span>
                                        <span>
                                            <lightning-formatted-date-time
                                                value={discountPeriodStart}
                                                year="numeric" month="short" day="2-digit">
                                            </lightning-formatted-date-time>
                                            &nbsp;&ndash;&nbsp;
                                            <template if:true={discountPeriodEnd}>
                                                <lightning-formatted-date-time
                                                    value={discountPeriodEnd}
                                                    year="numeric" month="short" day="2-digit">
                                                </lightning-formatted-date-time>
                                            </template>
                                            <template if:false={discountPeriodEnd}>
                                                <span class="ri-discount-open-ended">Open-ended</span>
                                            </template>
                                        </span>
                                    </div>
                                    <div class="ri-detail-row">
                                        <span class="ri-detail-label">Coverage</span>
                                        <span class="ri-discount-coverage">{discountCoverageText}</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <template if:false={isPaidInvoice}>
                    <div class="ri-detail-actions">
                        <button class="ri-btn ri-btn--primary" onclick={handleMakePayment}>Make a Payment</button>
                    </div>
                </template>
            </div>
        </template>
    </div>
</template>
