<template>
    <div class="ri-card">
        <div class="ri-card__header">
            <div class="ri-card__header-icon">
                <lightning-icon icon-name="utility:settings" size="small" alternative-text="Maintenance"></lightning-icon>
            </div>
            <h2 class="ri-card__title">Maintenance Request</h2>
        </div>

        <template if:true={isLoading}>
            <div class="ri-spinner-wrap">
                <div class="ri-spinner"></div>
            </div>
        </template>

        <template if:false={isLoading}>
            <!-- Success -->
            <template if:true={submitSuccess}>
                <div class="ri-success">
                    <div class="ri-success__icon">
                        <lightning-icon icon-name="utility:success" size="large" alternative-text="Success"></lightning-icon>
                    </div>
                    <h3 class="ri-success__title">Request Submitted</h3>
                    <p class="ri-success__sub">Your maintenance request has been submitted and will be actioned by the property manager.</p>
                    <span class="ri-success__ref">Case: {submittedCaseNumber}</span>
                </div>
            </template>

            <!-- Form -->
            <template if:false={submitSuccess}>
                <div class="ri-card__body">
                    <lightning-record-edit-form
                        object-api-name="Case"
                        record-type-id={maintenanceRecordTypeId}
                        onsuccess={handleSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>

                        <div class="ri-form-fields">
                            <lightning-input-field field-name="Subject"></lightning-input-field>
                            <lightning-input-field field-name="Description"></lightning-input-field>

                            <template if:true={tenancyId}>
                                <div class="ri-context-strip">
                                    <lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>
                                    <span>{contextLabel}</span>
                                </div>
                            </template>

                            <lightning-input-field field-name="Property__c"
                                value={tenancyPropertyId}
                                class="ri-hidden-field">
                            </lightning-input-field>
                            <lightning-input-field field-name="Room__c"
                                value={tenancyRoomId}
                                class="ri-hidden-field">
                            </lightning-input-field>
                            <lightning-input-field field-name="Tenancy__c"
                                value={tenancyId}
                                class="ri-hidden-field">
                            </lightning-input-field>
                        </div>

                        <div class="ri-actions">
                            <lightning-button
                                type="submit"
                                label="Submit Request"
                                variant="brand">
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </div>
            </template>
        </template>
    </div>
</template>
